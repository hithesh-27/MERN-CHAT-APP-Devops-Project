apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: chat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: hitheshgowda10docker/chat-app:e48a566ee90524f4b00582391bd50c05c39e4aeb
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5000"
        - name: JWT_SECRET
          value: "chatappsecret"
        - name: MONGO_URI
          value: "mongodb://mongodb:27017/chat-app"
