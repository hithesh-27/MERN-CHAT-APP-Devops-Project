---
- name: Deploy Chat App
  hosts: app
  become: yes

  tasks:
    - name: Update packages
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create Docker network
      command: docker network create chat-network
      ignore_errors: yes

    - name: Remove old MongoDB
      command: docker rm -f mongodb
      ignore_errors: yes

    - name: Remove old Chat App
      command: docker rm -f chat-app
      ignore_errors: yes

    - name: Run MongoDB
      command: >
        docker run -d
        --name mongodb
        --network chat-network
        -p 27017:27017
        mongo:7

    - name: Pull Chat App Image
      command: docker pull hitheshgowda10docker/chat-app:latest

    - name: Run Chat App
      command: >
        docker run -d
        --name chat-app
        --network chat-network
        -e MONGO_URI=mongodb://mongodb:27017/chat-app
        -e JWT_SECRET=your_jwt_secret
        -e PORT=5000
        -e NODE_ENV=development
        -p 5000:5000
        hitheshgowda10docker/chat-app:latest
